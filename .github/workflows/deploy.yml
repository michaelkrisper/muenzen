name: Deploy

# Testet die App im Browser mit einem künstlichen Münzfoto und veröffentlicht
# sie danach auf GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # 20 Münzen im Wert von 11,06 Euro, siehe tools/make-fixture.py (Seed 1).
      - run: node tests/browser-check.mjs tests/fixtures/coins.jpg 20 1106

      - run: |
          mkdir _site
          cp -r index.html style.css app.js classify.js detect.js worker.js sw.js manifest.webmanifest icons vendor _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@v5
