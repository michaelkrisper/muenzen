name: Wrong recognition
description: Coins not found or classified as the wrong denomination
labels: [erkennung]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! An example photo helps most. Please only attach photos you
        took yourself; they become public here.
  - type: textarea
    id: was
    attributes:
      label: What happened?
      description: e.g. "2 euro coin recognised as 50 cent" or "three coins missing"
    validations:
      required: true
  - type: textarea
    id: foto
    attributes:
      label: Photo
      description: Drag it here or paste it.
  - type: input
    id: geraet
    attributes:
      label: Device and browser
      placeholder: Pixel 9, Chrome 152
